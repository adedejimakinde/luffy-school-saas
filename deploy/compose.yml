# The production stack, on one VPS.
#
#   CLASSNODE_TAG=<full commit sha> docker compose -f deploy/compose.yml up -d
#
# Never started by hand for a release: `deploy/deploy.sh <sha>` pulls the images
# CI built for that commit, migrates, swaps web and worker, and checks health.
# docs/deployment.md is the runbook.
#
# **No connection pooler, and no service may be added between web/worker and
# db that pools connections** — issue #115, docs/tenancy.md. Each gunicorn and
# Celery process connects to Postgres directly, a connection per request.

name: classnode

x-app: &app
  image: ghcr.io/adedejimakinde/luffy-school-saas:${CLASSNODE_TAG:?set CLASSNODE_TAG to the full commit SHA to run}
  env_file:
    - production.env
    - ${CLASSNODE_ETC:-/etc/classnode}/secrets.env
  environment:
    # Which commit this is, for Sentry's "release" (settings.py).
    CLASSNODE_RELEASE: ${CLASSNODE_TAG}
  restart: unless-stopped
  volumes:
    # Uploaded files (`files`, FILES_ROOT in production.env): on the VPS data
    # volume beside the database, owned by the app's user (uid 10001;
    # deploy/deploy.sh makes it so). Backed up nightly to B2 by `media-backup`.
    - ${CLASSNODE_DATA:-/srv/classnode}/media:/srv/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: ghcr.io/adedejimakinde/luffy-school-saas/caddy:${CLASSNODE_TAG:?set CLASSNODE_TAG}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      # PLATFORM_DOMAIN, from the one place it is named.
      - production.env
      # CLOUDFLARE_API_TOKEN and ACME_EMAIL, and nothing else: the proxy is the
      # process facing the internet, so it holds no application secret.
      - ${CLASSNODE_ETC:-/etc/classnode}/caddy.env
    volumes:
      # The certificate and ACME account. Kept, so a restart does not re-issue.
      - caddy-data:/data
      - caddy-config:/config
      # Uploaded files, read-only: Caddy sends one only when Django's answer
      # names it in X-Accel-Redirect (deploy/caddy/Caddyfile, `files.views`).
      - ${CLASSNODE_DATA:-/srv/classnode}/media:/srv/media:ro
    restart: unless-stopped
    depends_on:
      - web

  web:
    <<: *app
    # The image's CMD is gunicorn; nothing to override. The healthcheck asks
    # over plain HTTP inside the network, which is why `/healthz/` answers
    # ahead of the HTTPS redirect (schools/health.py).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    # Exec form, so celery is PID 1 and receives compose's SIGTERM itself —
    # the development compose file explains what goes wrong otherwise.
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info"]
    # Long enough for a warm shutdown to finish the card it is rendering.
    stop_grace_period: 2m

  # Photo, PDF and video work (`files.tasks`, the `media` queue): one process,
  # at low CPU priority, so an upload never starves the portal or delays a
  # report card's PDF on the default queue.
  media:
    <<: *app
    command: ["nice", "-n", "10", "celery", "-A", "celery_app", "worker", "-Q", "media",
              "--concurrency", "1", "--hostname", "media@%h", "--loglevel=info"]
    # A job's hard limit is four minutes (`files.tasks.LIMITS`).
    stop_grace_period: 5m

  # The nightly backup of the uploaded files to B2 (deploy/media-backup.sh),
  # run by cron and never by `up`. Encrypted by restic, into the same bucket
  # and prefix as the database backup, under media/.
  media-backup:
    <<: *app
    profiles: ["backup"]
    restart: "no"
    entrypoint: ["bash", "/app/deploy/media-backup.sh"]
    command: ["backup"]
    env_file:
      - production.env
      - ${CLASSNODE_ETC:-/etc/classnode}/secrets.env
      - path: ${CLASSNODE_ETC:-/etc/classnode}/backup.env
        required: false
    volumes:
      - ${CLASSNODE_DATA:-/srv/classnode}/media:/srv/media:ro
      - media-backup-cache:/home/app/.cache

  db:
    # Postgres 15 with WAL-G (deploy/postgres/Dockerfile), built by CI beside
    # the app image. Debian, and CI and the devcontainer use the same base —
    # the Dockerfile says why. A major version change is a dump and restore,
    # not an image bump, and belongs in its own change.
    image: ghcr.io/adedejimakinde/luffy-school-saas/postgres:${CLASSNODE_TAG:?set CLASSNODE_TAG}
    env_file:
      - production.env
      - ${CLASSNODE_ETC:-/etc/classnode}/secrets.env
      # WAL-G's B2 credentials, prefix and encryption key. Absent until B2
      # exists, and then archiving stays off (deploy/postgres/entrypoint.sh).
      - path: ${CLASSNODE_ETC:-/etc/classnode}/backup.env
        required: false
    volumes:
      # On the VPS volume, not the server's own disk, so the data outlives
      # a rebuilt server. Backups are separate and off-server (H3).
      - ${CLASSNODE_DATA:-/srv/classnode}/postgres:/var/lib/postgresql/data
    shm_size: 256mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The weekly restore test's database (deploy/restore-check.sh): the latest
  # backup, recovered from B2 into a throwaway volume, serving on the compose
  # network only. Never started by `up` — only by its profile.
  restore-db:
    image: ghcr.io/adedejimakinde/luffy-school-saas/postgres:${CLASSNODE_TAG:?set CLASSNODE_TAG}
    profiles: ["restore"]
    entrypoint: ["classnode-restore-serve"]
    env_file:
      - production.env
      - ${CLASSNODE_ETC:-/etc/classnode}/secrets.env
      - path: ${CLASSNODE_ETC:-/etc/classnode}/backup.env
        required: false
    volumes:
      - restore-data:/var/lib/postgresql/restore

  redis:
    image: redis:7-alpine
    # Append-only for the reason the development file gives: what Redis holds
    # is accepted jobs, and a snapshot window is the set a restart would drop.
    command: redis-server --appendonly yes
    volumes:
      - ${CLASSNODE_DATA:-/srv/classnode}/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  caddy-data:
  caddy-config:
  restore-data:
  # restic's index cache, so a nightly run does not re-read the repository.
  media-backup-cache:
