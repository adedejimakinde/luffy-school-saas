{% comment %}
The icon sprite every page draws its `<svg class="icon"><use href="#i-…"/></svg>`
from. One file, included once per page wherever it needs an icon — not inside
`design/head.html`, deliberately: that file is head-only content, and an
`<svg>` there would end the implicit `<head>` early and push the rest of a
template's `<link>`/`<script>` tags into the body. A page includes this where
its markup actually needs an icon instead.

`i-brand-mark` is drawn, not stroked, and does not take `class="icon"`: the
square is `currentColor` (so `.logo`'s `color: var(--brand)` reaches it) and
the triangle and its three dots are `var(--card)`, white — both design.css
tokens, never a literal colour, the same rule the rest of the palette is held
to. `.logo-mark` in design.css is its own sizing, next to `.logo`.

Grown page by page as pages restyle. `tests/ui/specimen.html` carries its own
copy for the parts no page uses yet; a symbol both files define has to stay
the same shape in both, or the specimen would be showing something no page
draws.

Every symbol below `i-brand-mark` is a plain stroke icon: no `fill`/`stroke`
attribute of its own, because `.icon` sets those in `design.css` and a symbol
that set them itself would stop inheriting `currentColor` from whatever colour
its `<svg class="icon">` is given (a nav link's text colour, hover included).
{% endcomment %}
