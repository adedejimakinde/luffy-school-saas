<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a school</title>
<!-- PHASE 1 MOCKUP of the staff sign-in flow (b: the school picker). Static; Phase 2 makes it real. -->
<link rel="preload" href="../../static/web/fonts/hanken-grotesk-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../static/web/design.css">
<link rel="stylesheet" href="staff-sign-in.css">
<body class="door">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-brand-mark" viewBox="0 0 24 24">
    <rect x="1" y="1" width="22" height="22" rx="6" fill="currentColor"/>
    <path d="M7 8L17 8L12 17Z" fill="none" stroke="var(--card)" stroke-width="1.3" stroke-linejoin="round"/>
    <circle cx="7" cy="8" r="2.1" fill="var(--card)"/>
    <circle cx="17" cy="8" r="2.1" fill="var(--card)"/>
    <circle cx="12" cy="17" r="2.1" fill="var(--card)"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></symbol>
  <symbol id="i-staff" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17c.5-2 2-3 4-3s3.5 1 4 3"/></symbol>
</svg>
<a class="door-logo" href="/" aria-label="Classnode"><svg class="logo-mark" aria-hidden="true"><use href="#i-brand-mark"/></svg>classnode</a>
<main>
<h1>Welcome back, Folake</h1>
<p class="lede">Choose a school to continue</p>
<div class="account">
  <span class="avatar" aria-hidden="true">FA</span>
  <div class="account-text">
    <span class="account-email">folake.adeyemi@example.com</span>
    <span class="quiet">Not you?</span>
    <form method="post" action="/staff-sign-out/"><button class="link-button" type="submit">Sign out</button></form>
  </div>
</div>
<ul class="schools" aria-label="Your schools">
  <li><a class="school" href="//sunrise-demo.classnode.co/home/">
    <span class="badge" aria-hidden="true">SD</span>
    <span class="school-text"><span class="school-name">Sunrise Demo Academy</span><span class="role-chip">Principal</span></span>
    <svg class="icon chev" aria-hidden="true"><use href="#i-chevron"/></svg>
  </a></li>
  <li><a class="school" href="//harbour-demo.classnode.co/home/">
    <span class="badge" aria-hidden="true">HD</span>
    <span class="school-text"><span class="school-name">Harbour Demo College</span><span class="role-chip">Teacher and parent</span></span>
    <svg class="icon chev" aria-hidden="true"><use href="#i-chevron"/></svg>
  </a></li>
</ul>
</main>
<p class="door-foot">Classnode</p>
</body>
</html>
