<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff sign in</title>
<!-- PHASE 1 MOCKUP of the staff sign-in flow (a: the form). Static; Phase 2 makes it real. -->
<link rel="preload" href="../../static/web/fonts/hanken-grotesk-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../static/web/design.css">
<link rel="stylesheet" href="staff-sign-in.css">
<body class="door">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-brand-mark" viewBox="0 0 24 24">
    <rect x="1" y="1" width="22" height="22" rx="6" fill="currentColor"/>
    <path d="M7 8L17 8L12 17Z" fill="none" stroke="var(--card)" stroke-width="1.3" stroke-linejoin="round"/>
    <circle cx="7" cy="8" r="2.1" fill="var(--card)"/>
    <circle cx="17" cy="8" r="2.1" fill="var(--card)"/>
    <circle cx="12" cy="17" r="2.1" fill="var(--card)"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></symbol>
  <symbol id="i-staff" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17c.5-2 2-3 4-3s3.5 1 4 3"/></symbol>
</svg>
<a class="door-logo" href="/" aria-label="Classnode"><svg class="logo-mark" aria-hidden="true"><use href="#i-brand-mark"/></svg>classnode</a>
<main>
<h1>Staff sign in</h1>
<p class="lede">Use the email address, phone number or staff ID your school has for you.</p>
<form method="post" action="/staff-sign-in/" novalidate>
  <div class="field">
    <label for="identifier">Email, phone number or staff ID</label>
    <input id="identifier" name="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="primary" type="submit">Sign in</button>
</form>
<p class="door-note">See your child's report card? <a href="/sign-in/">I'm a parent</a></p>
</main>
<p class="door-foot">Classnode</p>
</body>
</html>
