name: deploy

# The deploy button (decided 2026-09-23: manual, after school hours, never on
# merge). Deploys one commit by its full SHA, and only one that is on main and
# passed CI on that exact SHA — the `test` check (all four of the suite's
# jobs), the `image` job that built and checked the images, and the `publish`
# job that gave them the SHA name `deploy/deploy.sh` will pull.
#
# Needs, before it can run for real: the server, and three repository secrets —
# DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS. docs/deployment.md.
#
# The server's copy of the repository (/opt/classnode) is moved to the exact SHA
# being released **before** deploy.sh runs. deploy.sh pulls that SHA's images, but
# it reads compose.yml and its own text from the checkout, so a checkout left on
# an older commit would deploy new images with old orchestration.
# tests/test_deploy_workflow.py pins this, and runs the step against a real
# repository.
#
# **A rollback is never silent** (decided 2026-10-18, after two runs deployed a
# week-old SHA pasted in place of the new one and went green). The run is named
# after the SHA it was given, not the branch it ran from; it refuses a SHA that
# is not a descendant of the one running (`deploy/deployed-sha`) unless
# `rollback` is ticked; and it ends by reading `deployed-sha` back, writing it to
# the run's summary and failing if it is not the SHA it was given.

run-name: deploy ${{ inputs.sha }}${{ inputs.rollback && ' (rollback)' || '' }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA on main whose CI passed
        required: true
      rollback:
        description: Tick only to go back to a commit older than the one running
        type: boolean
        default: false

# One deploy at a time, and a second never cancels a first mid-migration.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  deploy:
    # Pinned to the server's release, Ubuntu 24.04, not ubuntu-latest, which
    # moves to Ubuntu 26.04 on 19 October 2026.
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ inputs.sha }}
      ROLLBACK: ${{ inputs.rollback }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: A full SHA, on main
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Give the full 40-character SHA, not a branch or a short one."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main."
            exit 1
          fi

      # Asked of the SHA, not of a pull request's rollup, which can still be
      # showing the previous commit's green. All three must exist and have
      # succeeded: an empty list is "never ran", not "passed". `publish` is the
      # one that makes the `<sha>` tags exist at all, since `image` now pushes
      # only `candidate-<sha>`; without it, deploy.sh would fail at the pull.
      - name: CI passed on exactly this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" --jq '
            [.check_runs[] | select(.name == "test" or .name == "image" or .name == "publish")] as $runs
            | if ($runs | map(.name) | unique | length) == 3
                 and ($runs | all(.status == "completed" and .conclusion == "success"))
              then "passed" else "not passed" end')
          if [ "$verdict" != "passed" ]; then
            echo "::error::CI has not passed on $SHA ('test', 'image' and 'publish' must all succeed)."
            exit 1
          fi

      - name: Set up SSH
        id: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Fetch, then check out the SHA itself — never a branch, never a pull, so
      # what is checked out is the commit CI passed and not whatever main has
      # moved to since. It refuses a checkout with local edits (a hand-edited
      # compose.yml would otherwise survive the checkout and be deployed), and
      # it asks git afterwards rather than trusting the command that just ran.
      #
      # Before it moves anything, it compares the SHA with the one running: a
      # SHA that does not contain `deployed-sha` (an older commit, or one git
      # cannot place) goes back in time, and is refused unless `rollback` is
      # ticked. With nothing deployed yet there is nothing to compare.
      - name: Check out the SHA on the server
        id: checkout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@$DEPLOY_HOST" bash -s -- "$SHA" "$ROLLBACK" <<'REMOTE'
          set -euo pipefail
          sha=$1
          rollback=${2:-false}
          cd /opt/classnode
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "The server's checkout has local changes; refusing to deploy over them:" >&2
            git status --short --untracked-files=no >&2
            exit 1
          fi
          git fetch --quiet origin main
          running=$(cat deploy/deployed-sha 2>/dev/null || true)
          if [ -n "$running" ] && ! git merge-base --is-ancestor "$running" "$sha" 2>/dev/null; then
            if [ "$rollback" != "true" ]; then
              echo "Refusing to go back: $running is running and $sha is not newer than it." >&2
              echo "Check the SHA you pasted. To roll back on purpose, run again with 'rollback' ticked." >&2
              exit 1
            fi
            echo "Rolling back from $running to $sha, as asked"
          fi
          git checkout --quiet --detach "$sha"
          if [ "$(git rev-parse HEAD)" != "$sha" ]; then
            echo "The server's checkout is not at $sha." >&2
            exit 1
          fi
          echo "Server checkout is at $sha"
          REMOTE

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@$DEPLOY_HOST" "/opt/classnode/deploy/deploy.sh $SHA"

      # What the server says it is running, read back rather than assumed: the
      # run's summary names it, and a run that did not end on the SHA it was
      # given is red. After a failed deploy it still runs, to say what is
      # serving instead.
      - name: Read back what is running
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          deployed=$(ssh -i ~/.ssh/deploy_key "deploy@$DEPLOY_HOST" "cd /opt/classnode/deploy && cat deployed-sha 2>/dev/null || true")
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Asked for | \`$SHA\` |"
            echo "| Rollback ticked | $ROLLBACK |"
            echo "| Running now (\`deploy/deployed-sha\`) | \`${deployed:-nothing}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$deployed" != "$SHA" ]; then
            echo "::error::The server is running ${deployed:-nothing}, not $SHA."
            exit 1
          fi
          echo "The server is running $SHA"

      # A deploy that fails leaves the old images running (deploy.sh puts them
      # back, or never swapped them), and `deployed-sha` still names them. Put the
      # checkout back on that commit so the server's files match what is running.
      # It never turns a red run green or hides why it was red.
      - name: Put the checkout back on what is running
        if: failure() && (steps.checkout.outcome == 'success' || steps.checkout.outcome == 'failure')
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/classnode
          if [ -s deploy/deployed-sha ]; then
            git checkout --quiet --detach "$(cat deploy/deployed-sha)"
            echo "Server checkout put back on $(cat deploy/deployed-sha)"
          fi
          REMOTE
