name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        # `bash` rather than the default, which is `bash -e` **without**
        # pipefail: in that shell `a | b` reports b's exit code, so a failing
        # command feeding a successful one passes. Naming the shell explicitly
        # gets `-eo pipefail`, which is the difference between a step that
        # fails and a step that lies. No step here pipes today; the point is
        # that adding one later must not silently re-open the hole. Issue #61,
        # and `scripts/run-tests.sh` carries the argument in full.
        shell: bash

    # The suite is not runnable without a real Postgres, and deliberately so:
    # schools/tests/test_tenant_isolation.py asserts against pg_namespace,
    # pg_tables and pg_constraint; `tenant_template` is built by a real
    # migrate_schemas run; and every make_school() issues a real CREATE SCHEMA
    # and copies that template with catalogue SQL — pg_constraint,
    # pg_get_triggerdef and the rest — which nothing but Postgres has. SQLite
    # or a mocked backend would turn the isolation proof into a tautology.
    services:
      postgres:
        # Matched to docker-compose.yml so CI and the devcontainer agree.
        image: postgres:15-alpine
        env:
          POSTGRES_DB: luffy_db
          POSTGRES_USER: luffy_admin
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        # Without this the first migration can land before Postgres is
        # accepting connections, which fails as a confusing OperationalError.
        options: >-
          --health-cmd "pg_isready -U luffy_admin -d luffy_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The Celery broker. Here for one test — the one that opens a connection
      # to the configured broker and pings it. Everything else about the queue
      # can be asserted from configuration alone, but "the URL in settings.py
      # reaches a Redis" cannot, and it is the half that breaks silently: a
      # broker nobody can reach makes `.delay()` succeed and the job vanish.
      redis:
        # Matched to docker-compose.yml so CI and the devcontainer agree.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: luffy_db
      POSTGRES_USER: luffy_admin
      POSTGRES_PASSWORD: changeme
      # Not "db": the service is published on the runner's own network here,
      # unlike docker-compose where it is reachable by service name.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # settings.py refuses to start without this unless DJANGO_DEBUG is on, and
      # CI deliberately does not turn DEBUG on: running the suite the way a
      # deployment is configured is the point. Throwaway and public — it signs
      # nothing that outlives the job.
      DJANGO_SECRET_KEY: ci-only-not-a-secret-a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
      # `localhost` rather than `redis`, for the reason POSTGRES_HOST is
      # `localhost` above: the service is published on the runner's network
      # here, not reachable by service name as it is under docker-compose.
      CELERY_BROKER_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # WeasyPrint's text layout is Pango's, which is not in the wheel. Without
      # these the package installs and every import of it raises OSError — so
      # the suite would fail on the PDF tests with a message about a missing
      # shared library, a long way from the requirements file that asked for it.
      # The same WeasyPrint list as .devcontainer/Dockerfile, which says more
      # about why. That file installs `postgresql-client` alongside these and
      # this one deliberately does not: the client is for reaching the database
      # by hand from a devcontainer shell, and CI talks to the `postgres`
      # service through psycopg2. Everything WeasyPrint needs is in both.
      - name: WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8 fonts-dejavu-core

      - run: pip install -r requirements.txt

      # Catches a model edited without its migration, which the test suite
      # would otherwise sail past — the test database is built from the models.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # The deployment checklist, including this project's own `accounts.E001`
      # — the one that refuses a SESSION_COOKIE_DOMAIN-less deploy, because a
      # session opened on the portal would not be sent to any school's host.
      # Registered `deploy=True`, so nothing else in this file would ever run
      # it, and a check nothing runs is close to a check that does not exist.
      #
      # This is not a substitute for running it against the real deployment's
      # environment, which is where the settings actually differ. What it
      # catches here is a check that has started failing for everybody, and a
      # setting regressing to a default that fails open.
      - name: Deployment checks
        env:
          SESSION_COOKIE_DOMAIN: .example.test
        run: python manage.py check --deploy

      # `--parallel` splits the suite across worker processes, each with its own
      # clone of the test database. Both halves of the suite's cost are now
      # addressed here, and they interact, so it is worth stating the order.
      #
      # One tenant schema *is* baked into the test database — `tenant_template`,
      # migrated once by `schools/tests/runner.py`. It is built before Django
      # clones the database for the workers, which is deliberate: each worker
      # inherits it through `CREATE DATABASE ... TEMPLATE ...` and none of them
      # migrates anything. Built the other way round, every worker would pay
      # for its own. The database being copied is larger than the ~8 MB it was
      # when nothing was baked in, and that is the trade: one bigger clone per
      # worker, against ~1,479 schema migrations that no longer happen.
      #
      # `make_school()` then copies that schema per test — the ~1.65s of CREATE
      # SCHEMA plus migrations that used to run once per test method, and was
      # about 90% of this job's wall clock. `--parallel` remains the other half:
      # the same work, spread over the runner's cores.
      #
      # Through `scripts/run-tests.sh` rather than calling `manage.py` directly,
      # so that CI and a developer's terminal apply the same two guards — and
      # so "green locally" and "green in CI" are the same claim. With no
      # arguments the script runs exactly the invocation this step used to:
      # `--verbosity 2 --parallel`.
      #
      # The guard that matters here is the one for a zero exit with no `OK`
      # line. A suite that returns success without completing would otherwise
      # be a green tick, which is the same failure-with-no-symptom this file
      # already refuses for an unreachable broker a few steps up.
      - name: Run tests
        run: scripts/run-tests.sh
