name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        # `bash` rather than the default, which is `bash -e` **without**
        # pipefail: in that shell `a | b` reports b's exit code, so a failing
        # command feeding a successful one passes. Naming the shell explicitly
        # gets `-eo pipefail`, which is the difference between a step that
        # fails and a step that lies. No step here pipes today; the point is
        # that adding one later must not silently re-open the hole. Issue #61,
        # and `scripts/run-tests.sh` carries the argument in full.
        shell: bash

    # The suite is not runnable without a real Postgres, and deliberately so:
    # schools/tests/test_tenant_isolation.py asserts against pg_namespace,
    # pg_tables and pg_constraint; `tenant_template` is built by a real
    # migrate_schemas run; and every make_school() issues a real CREATE SCHEMA
    # and copies that template with catalogue SQL — pg_constraint,
    # pg_get_triggerdef and the rest — which nothing but Postgres has. SQLite
    # or a mocked backend would turn the isolation proof into a tautology.
    services:
      postgres:
        # Matched to docker-compose.yml and to the production database image
        # (deploy/postgres/Dockerfile), which is Debian because WAL-G ships
        # glibc builds only. Text sorts by the C library's collation, so the
        # tests run against the same one production does.
        image: postgres:15-bookworm
        env:
          POSTGRES_DB: luffy_db
          POSTGRES_USER: luffy_admin
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        # Without this the first migration can land before Postgres is
        # accepting connections, which fails as a confusing OperationalError.
        options: >-
          --health-cmd "pg_isready -U luffy_admin -d luffy_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The Celery broker. Here for one test — the one that opens a connection
      # to the configured broker and pings it. Everything else about the queue
      # can be asserted from configuration alone, but "the URL in settings.py
      # reaches a Redis" cannot, and it is the half that breaks silently: a
      # broker nobody can reach makes `.delay()` succeed and the job vanish.
      redis:
        # Matched to docker-compose.yml so CI and the devcontainer agree.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: luffy_db
      POSTGRES_USER: luffy_admin
      POSTGRES_PASSWORD: changeme
      # Not "db": the service is published on the runner's own network here,
      # unlike docker-compose where it is reachable by service name.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # settings.py refuses to start without this unless DJANGO_DEBUG is on, and
      # CI deliberately does not turn DEBUG on: running the suite the way a
      # deployment is configured is the point. Throwaway and public — it signs
      # nothing that outlives the job.
      DJANGO_SECRET_KEY: ci-only-not-a-secret-a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
      # `localhost` rather than `redis`, for the reason POSTGRES_HOST is
      # `localhost` above: the service is published on the runner's network
      # here, not reachable by service name as it is under docker-compose.
      CELERY_BROKER_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # WeasyPrint's text layout is Pango's, which is not in the wheel. Without
      # these the package installs and every import of it raises OSError — so
      # the suite would fail on the PDF tests with a message about a missing
      # shared library, a long way from the requirements file that asked for it.
      # The same WeasyPrint list as .devcontainer/Dockerfile, which says more
      # about why. That file installs `postgresql-client` alongside these and
      # this one deliberately does not: the client is for reaching the database
      # by hand from a devcontainer shell, and CI talks to the `postgres`
      # service through psycopg2. Everything WeasyPrint needs is in both.
      - name: WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8 fonts-dejavu-core

      - run: pip install -r requirements.txt

      # Catches a model edited without its migration, which the test suite
      # would otherwise sail past — the test database is built from the models.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # The deployment checklist, including this project's own `accounts.E001`
      # — the one that refuses a SESSION_COOKIE_DOMAIN-less deploy, because a
      # session opened on the portal would not be sent to any school's host.
      # Registered `deploy=True`, so nothing else in this file would ever run
      # it, and a check nothing runs is close to a check that does not exist.
      #
      # Run under the committed production configuration, `deploy/production.env`
      # — the file the server runs with — rather than a stand-in cookie domain,
      # so this is the checklist for the settings that actually deploy. Every
      # warning fails it; the one silenced (HSTS preload, `security.W021`) is
      # silenced in settings.py with its reason. `tests/test_deployment.py` runs
      # the same check inside the suite, and the `image` job below runs it once
      # more inside the built image.
      - name: Deployment checks
        run: |
          set -a
          . deploy/production.env
          set +a
          python manage.py check --deploy --fail-level WARNING

      # The report card page's assets, collected the way a deployment collects
      # them — and **before the suite runs, because the suite needs them.**
      #
      # This job deliberately does not set DJANGO_DEBUG, so `settings.STORAGES`
      # selects WhiteNoise's hashed, pre-compressed storage here. That storage
      # serves nothing that is not in a manifest, and the manifest is written by
      # this command: without this step every `{% static %}` in the page's
      # template raises `Missing staticfiles manifest entry` during the tests,
      # and the failure reads like a broken template rather than an uncollected
      # asset.
      #
      # So it is two checks in one. It proves `collectstatic` succeeds — the
      # step a deployment cannot skip — and it lets the suite exercise the
      # production storage rather than the plain one a developer's DEBUG=1 gets.
      - name: Collect static files
        run: python manage.py collectstatic --noinput

      # The page is vanilla ES modules with no build step, so its renderers are
      # pure functions of a payload and its four refusal states are pure
      # functions of an API body. `node --test` asserts them with no browser,
      # no DOM and nothing installed: `package.json` has no dependencies, there
      # is no `node_modules`, and `npm test` is one `node --test` invocation.
      #
      # A refusal is the path nobody demos — a withheld card, a lapsed session,
      # a wrong link — which is exactly why they are tested here rather than
      # eyeballed once.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Page module tests
        run: npm test

      # `--parallel` splits the suite across worker processes, each with its own
      # clone of the test database. Both halves of the suite's cost are now
      # addressed here, and they interact, so it is worth stating the order.
      #
      # One tenant schema *is* baked into the test database — `tenant_template`,
      # migrated once by `schools/tests/runner.py`. It is built before Django
      # clones the database for the workers, which is deliberate: each worker
      # inherits it through `CREATE DATABASE ... TEMPLATE ...` and none of them
      # migrates anything. Built the other way round, every worker would pay
      # for its own. The database being copied is larger than the ~8 MB it was
      # when nothing was baked in, and that is the trade: one bigger clone per
      # worker, against ~1,479 schema migrations that no longer happen.
      #
      # `make_school()` then copies that schema per test — the ~1.65s of CREATE
      # SCHEMA plus migrations that used to run once per test method, and was
      # about 90% of this job's wall clock. `--parallel` remains the other half:
      # the same work, spread over the runner's cores.
      #
      # Through `scripts/run-tests.sh` rather than calling `manage.py` directly,
      # so that CI and a developer's terminal apply the same two guards — and
      # so "green locally" and "green in CI" are the same claim. With no
      # arguments the script runs exactly the invocation this step used to:
      # `--verbosity 2 --parallel`.
      #
      # The guard that matters here is the one for a zero exit with no `OK`
      # line. A suite that returns success without completing would otherwise
      # be a green tick, which is the same failure-with-no-symptom this file
      # already refuses for an unreachable broker a few steps up.
      - name: Run tests
        run: scripts/run-tests.sh

  # The production images, built only once the suite above has passed on this
  # commit, and tagged with its full SHA — the only name `deploy/deploy.sh`
  # accepts, so what runs on the server is always a commit that passed here.
  #
  # Built on every pull request as well, because a Dockerfile nobody builds
  # until the day of a deploy is a deploy that fails for a reason unrelated to
  # the change being shipped. Pushed to GHCR from `main` only.
  #
  # Each check below is something the devcontainer cannot run (there is no
  # Docker in it), so this job is the only place the image, the Caddyfile and
  # the compose file are tested at all.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      CADDY_IMAGE: ghcr.io/${{ github.repository }}/caddy:${{ github.sha }}
      POSTGRES_IMAGE: ghcr.io/${{ github.repository }}/postgres:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the application image
        run: docker build -t "$APP_IMAGE" .

      # The slim base carries nothing it does not have to, so a WeasyPrint
      # library the devcontainer happened to have could be missing here — and
      # it would fail at a parent's first download, not at build time. This
      # makes it fail here.
      - name: The image renders a PDF
        run: >-
          docker run --rm "$APP_IMAGE" python -c
          "import weasyprint; assert weasyprint.HTML(string='<p>x</p>').write_pdf()[:4] == b'%PDF'"

      - name: The image passes the deployment checklist under production.env
        run: >-
          docker run --rm --env-file deploy/production.env
          -e DJANGO_SECRET_KEY="ci-image-check-$(openssl rand -hex 32)"
          -e POSTGRES_PASSWORD=unused
          "$APP_IMAGE" python manage.py check --deploy --fail-level WARNING

      - name: Build the Caddy image
        run: docker build -t "$CADDY_IMAGE" deploy/caddy

      # Placeholders: `validate` parses the file and provisions its modules,
      # including the Cloudflare DNS one, without asking Cloudflare or Let's
      # Encrypt for anything. The module does check the token's *shape* when it
      # provisions — `caddy-dns/cloudflare` v0.2.4 accepts `cf(ut|at)_…` or a
      # legacy 35–50 characters of `[A-Za-z0-9_-]` — so the placeholder is an
      # obviously fake one in that shape, not the word "placeholder", which it
      # refused.
      - name: The Caddyfile is valid
        run: >-
          docker run --rm -e PLATFORM_DOMAIN=example.test
          -e CLOUDFLARE_API_TOKEN="ci-placeholder-$(openssl rand -hex 12)"
          -e ACME_EMAIL=ci@example.test
          "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile

      - name: Build the database image
        run: docker build -t "$POSTGRES_IMAGE" deploy/postgres

      # The binary is checksummed at build time; this asks whether it *runs*
      # in this image — a library it links against that the image lacks
      # fails here, not on the first night the backup should have run.
      - name: WAL-G runs in the database image, and its scripts parse
        run: |
          docker run --rm --entrypoint wal-g "$POSTGRES_IMAGE" --version
          docker run --rm --entrypoint bash "$POSTGRES_IMAGE" -c \
            'for f in /usr/local/bin/classnode-*; do bash -n "$f" || exit 1; done'
          docker run --rm --entrypoint python3 "$POSTGRES_IMAGE" -c \
            'import ast; ast.parse(open("/usr/local/lib/classnode/retention.py").read())'

      - name: The compose file is valid
        run: |
          mkdir -p "$RUNNER_TEMP/etc"
          touch "$RUNNER_TEMP/etc/secrets.env" "$RUNNER_TEMP/etc/caddy.env"
          CLASSNODE_ETC="$RUNNER_TEMP/etc" CLASSNODE_TAG="${{ github.sha }}" \
            docker compose -f deploy/compose.yml config --quiet

      - name: Push the images (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$APP_IMAGE"
          docker push "$CADDY_IMAGE"
          docker push "$POSTGRES_IMAGE"
