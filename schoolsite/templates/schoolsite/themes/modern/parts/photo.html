{% comment %}One gallery photo. The link opens the large size with no script at all; with the site's script, a tap opens it over the page instead (`static/schoolsite/site-app.js`).{% endcomment %}<figure><a class="photo" href="{{ p.large_jpeg }}" data-avif="{{ p.large_avif }}" data-webp="{{ p.large_webp }}" data-w="{{ p.w }}" data-h="{{ p.h }}">{% include "schoolsite/themes/modern/parts/picture.html" %}</a>{% if p.caption %}<figcaption>{{ p.caption }}</figcaption>{% endif %}</figure>
